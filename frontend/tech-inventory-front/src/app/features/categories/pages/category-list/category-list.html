<section class="category-list">
  <header class="category-list-header">
    <h1 class="category-list-title">Categories</h1>
    <button mat-flat-button type="button" color="primary" *ngIf="showNewCategoryButton" (click)="goToNewCategory()">
      New Category
    </button>
  </header>

  @if (isLoading()) {
    <p class="category-status">Cargando categorías...</p>
  } @else if (error()) {
    <p class="category-status category-status--error" role="alert">{{ error() }}</p>
  } @else {
    <div class="category-table-container">
      <table mat-table [dataSource]="categories()" class="category-table">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let category">{{ category.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let category">{{ category.name }}</td>
        </ng-container>

        <ng-container matColumnDef="prefix">
          <th mat-header-cell *matHeaderCellDef>Prefix</th>
          <td mat-cell *matCellDef="let category">{{ category.prefixCode }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let category">
            <button class="category-action" mat-icon-button type="button" aria-label="Editar categoría">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="category-action" mat-icon-button type="button" aria-label="Eliminar categoría">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</section>
