spring.application.name=techinventory-service

#Data source
spring.datasource.url=jdbc:mariadb://localhost:3307/tech_inventory
spring.datasource.username=TU_USERNAME_BD
spring.datasource.password=TU_PASSWORD_BD
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT
jwt.secret=tech-inventory-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000